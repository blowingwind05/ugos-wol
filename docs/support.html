<h2>反馈时可以附上</h2>
<ul>
<li>应用版本、NAS 型号和 UGOS 版本。</li>
<li>访问方式，例如电脑客户端、手机客户端或浏览器。</li>
<li>复现步骤和错误提示。有截图或诊断信息时，请先遮盖密码、令牌和个人信息。</li>
</ul>

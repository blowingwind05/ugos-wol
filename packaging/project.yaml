spec_version: "2.1"
app_id: com.local.wol
version: "0.2.4"
support_arch:
  - amd64
product_series:
  - nasync
supports:
  - app
  - pc
start_cmd: "bin/wol --port=28089 --bind=127.0.0.1"
port: 28089
proxy_path: api/wol
open_type: inner
only_admin: true
tag_types:
  - utility
depend_fw_version: "1.13.0.0000"
permissions:
  - NETWORK.ACCESS_INTERNET
i18n:
  zh-CN:
    name: 远程唤醒
    description: 利用绿联远程访问，以 NAS 为中继，从外网唤醒家中的电脑。本应用通过 NAS 发送 WOL（网络唤醒）魔术包，唤醒与 NAS 同一局域网内的兼容设备。电脑启动后，可搭配已配置好的 UU 远程或 Sunshine + Moonlight，进行远程办公与游戏串流。本应用不用于唤醒 NAS 本身。
    author: Personal Tools
  en-US:
    name: Remote Wake
    description: Use UGREEN remote access to open this app from outside your home, then let your NAS send Wake-on-LAN (WOL) magic packets to compatible devices on its local network. Once the computer starts, connect using your configured UU Remote or Sunshine + Moonlight setup for remote work or game streaming. This app does not wake the NAS itself.
    author: Personal Tools
license_agreement_link:
  - https://opensource.org/license/mit
source_code_link:
  - https://www.npmjs.com/package/@ugreen-nas/core
  - https://go.dev/src/

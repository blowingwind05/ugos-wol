spec_version: "2.1"
app_id: com.local.wol
version: "0.2.4"
support_arch:
  - amd64
  - arm64
product_series:
  - nasync
supports:
  - app
  - pc
start_cmd: "bin/wol --port=28089 --bind=127.0.0.1"
port: 28089
proxy_path: api/wol
open_type: inner
only_admin: true
tag_types:
  - utility
depend_fw_version: "1.13.0.0000"
permissions:
  - NETWORK.ACCESS_INTERNET
i18n:
  zh-CN:
    name: 远程唤醒
    description: 通过运行中的绿联 NAS 发送标准 WOL（网络唤醒）魔术包，唤醒同一局域网内的兼容设备。可用于远程办公、工作站与服务器维护、网络存储访问及游戏串流等场景。目标设备需支持 WOL；远程连接由对应软件提供。本应用不用于唤醒承载它的 NAS。
    author: UGOS WOL contributors
  en-US:
    name: Remote Wake
    description: Send standard Wake-on-LAN (WOL) magic packets from a running UGREEN NAS to compatible devices on the same local network. Use it for remote work, workstation and server maintenance, storage access, and game streaming. Remote connections are provided by separately configured tools. This app does not wake the NAS hosting it.
    author: UGOS WOL contributors
license_agreement_link:
  - https://opensource.org/license/mit
source_code_link:
  - https://www.npmjs.com/package/@ugreen-nas/core
  - https://go.dev/src/
  - https://github.com/microsoft/fluentui-system-icons
